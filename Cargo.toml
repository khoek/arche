[workspace]
resolver = "3"
members = ["crates/arche-firestore", "crates/arche-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Arche contributors"]
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/khoek/arche"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
